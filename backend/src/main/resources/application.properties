spring.application.name=ecommerce-poc
server.port=3001
server.address=127.0.0.1

spring.datasource.url=jdbc:sqlite:./data/ecommerce.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

spring.security.user.name=unused
spring.security.user.password=unused

app.frontend.origin=http://localhost:5173
app.api.base-url=http://localhost:3001

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api/openapi.json
